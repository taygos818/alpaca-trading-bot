name: alpaca-trading-bot-paper

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alpaca_agent_paper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PAPER_POSTGRES_PASSWORD:?set PAPER_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${PAPER_POSTGRES_PORT:-56433}:5432"
    volumes:
      - alpaca_agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alpaca_agent_paper"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${PAPER_REDIS_PORT:-57380}:6379"
    volumes:
      - alpaca_agent_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  alpaca-mcp:
    profiles: ["research"]
    build: ./services/alpaca-mcp
    restart: unless-stopped
    env_file:
      - path: .env.paper.secrets
        required: false
    environment:
      ALPACA_PAPER_TRADE: "true"
      ALPACA_TOOLSETS: ${ALPACA_MCP_TOOLSETS:-account,assets,stock-data,options-data,index-data,corporate-actions,news}
    command: ["alpaca-mcp-server", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:${ALPACA_MCP_HOST_PORT:-8181}:8080"

  scheduler:
    build: ./services/scheduler
    restart: unless-stopped
    env_file:
      - path: .env.paper.secrets
        required: false
    environment:
      BOT_ENVIRONMENT: paper
      ALPACA_PAPER_TRADE: "true"
      ALPACA_TRADING_API_URL: https://paper-api.alpaca.markets
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: host=postgres port=5432 dbname=alpaca_agent_paper user=postgres password=${PAPER_POSTGRES_PASSWORD}
      HEARTBEAT_PATH: /app/paper-data/scheduler-heartbeat
      DISCOVERY_OUTPUT_PATH: /app/paper-data/market-shortlist.json
      PREMARKET_DISCOVERY_OUTPUT_PATH: /app/paper-data/premarket-watchlist.json
      DISCOVERY_SCHEDULER_ENABLED: "true"
      DISCOVERY_SCHEDULE_HOUR: "9"
      DISCOVERY_SCHEDULE_MINUTES: "30,32,35"
      PREMARKET_DISCOVERY_ENABLED: "true"
      PREMARKET_DISCOVERY_HOUR: "9"
      PREMARKET_DISCOVERY_MINUTES: "0,15"
      ENGINE_HEARTBEAT_PATH: /app/paper-data/engine-heartbeat
      ENGINE_HEARTBEAT_MAX_AGE_SECONDS: "90"
      ALLOW_MOCK_DATA_FALLBACK: "false"
    volumes:
      - ./paper-data:/app/paper-data
      - ./paper-logs/scheduler:/app/logs
      - ./services/strategy-engine/utils:/app/utils:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  strategy-engine:
    build: ./services/strategy-engine
    restart: unless-stopped
    env_file:
      - path: .env.paper.secrets
        required: false
    environment:
      BOT_ENVIRONMENT: paper
      BOT_STRATEGY: defined_risk_options
      TRADING_LANE: options_paper
      ACTIVE_BROKER: alpaca
      AGENT_COORDINATOR_ENABLED: ${AGENT_COORDINATOR_ENABLED:-false}
      AGENT_COORDINATOR_SHADOW_MODE: ${AGENT_COORDINATOR_SHADOW_MODE:-true}
      ALPACA_PAPER_TRADE: "true"
      ALPACA_TRADING_API_URL: https://paper-api.alpaca.markets
      ALPACA_ORDER_DRY_RUN: ${PAPER_ORDER_DRY_RUN:-true}
      PAPER_ORDER_SUBMISSION_ENABLED: ${PAPER_ORDER_SUBMISSION_ENABLED:-false}
      DEFINED_RISK_OPTIONS_ENABLED: ${DEFINED_RISK_OPTIONS_ENABLED:-false}
      OPTIONS_MARKET_DATA_FEED: ${OPTIONS_MARKET_DATA_FEED:-indicative}
      OPTIONS_MIN_DTE: ${OPTIONS_MIN_DTE:-7}
      OPTIONS_MAX_DTE: ${OPTIONS_MAX_DTE:-21}
      M6_BOUNDED_SUBMISSION_ACK: ${M6_BOUNDED_SUBMISSION_ACK:-}
      PAPER_MAX_SUBMISSIONS_PER_DAY: ${PAPER_MAX_SUBMISSIONS_PER_DAY:-30}
      M6_MAX_AUTHORIZED_LOSS_USD: ${M6_MAX_AUTHORIZED_LOSS_USD:-5000}
      M6_MAX_OPEN_ORDERS: ${M6_MAX_OPEN_ORDERS:-8}
      M6_MAX_CANDIDATES_PER_CYCLE: ${M6_MAX_CANDIDATES_PER_CYCLE:-10}
      M6_AGENT_LOOP_SECONDS: ${M6_AGENT_LOOP_SECONDS:-30}
      PAPER_SUBMISSION_LEDGER_PATH: /app/logs/submissions.jsonl
      PENDING_ENTRY_PATH: /app/logs/pending-entries.jsonl
      EXIT_ORDER_PATH: /app/logs/exit-orders.jsonl
      DECISION_TRACE_PATH: /app/logs/decision-traces.jsonl
      EXIT_PLAN_PATH: /app/logs/exit-plans.jsonl
      COMPETITION_ENTRY_START_AT: "2026-08-31T09:30:00-04:00"
      COMPETITION_ENTRY_CUTOFF_AT: "2026-09-03T15:15:00-04:00"
      COMPETITION_FORCE_FLATTEN_AT: "2026-09-03T15:45:00-04:00"
      OPTIONS_MAX_CONTRACTS: "10"
      OPTIONS_MAX_TRADE_RISK_PCT: "0.05"
      OPTIONS_MAX_TOTAL_RISK_PCT: "0.50"
      OPTIONS_MAX_UNDERLYING_RISK_PCT: "0.15"
      OPTIONS_MAX_CORRELATION_RISK_PCT: "0.40"
      OPTIONS_MIN_CASH_BUFFER_PCT: "0.05"
      OPTIONS_DAILY_LOSS_LIMIT_PCT: "0.12"
      OPTIONS_MAX_OPEN_POSITIONS: "10"
      OPTIONS_MAX_PENDING_ORDERS: "8"
      OPTIONS_PROFIT_TARGET_PCT: "0.25"
      OPTIONS_LOSS_LIMIT_PCT: "0.30"
      OPTIONS_MAX_HOLDING_DAYS: "1"
      MARKET_DATA_PROVIDER: alpaca
      ALLOW_MOCK_DATA_FALLBACK: "false"
      ALLOW_MOCK_IV_RANK: "false"
      REQUIRE_BROKER_STATE_FOR_TRADES: "true"
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: host=postgres port=5432 dbname=alpaca_agent_paper user=postgres password=${PAPER_POSTGRES_PASSWORD}
      STRATEGY_CONFIG_PATH: /app/strategy.toml
      HEARTBEAT_PATH: /app/paper-data/engine-heartbeat
      ORDER_LOG_PATH: /app/logs/orders.jsonl
      TRADE_LOG_PATH: /app/logs/trades.jsonl
      MAX_TRADE_RISK_PCT: ${MAX_TRADE_RISK_PCT:-0.01}
      DAILY_DRAWDOWN_LIMIT: ${DAILY_DRAWDOWN_LIMIT:-0.03}
      MAX_CONCENTRATION_PCT: ${MAX_CONCENTRATION_PCT:-0.15}
      MAX_GROSS_EXPOSURE_PCT: ${MAX_GROSS_EXPOSURE_PCT:-0.50}
      MIN_CASH_BUFFER_PCT: ${MIN_CASH_BUFFER_PCT:-0.20}
    volumes:
      - ./paper-data:/app/paper-data
      - ./paper-logs/strategy-engine:/app/logs
      - ./strategy.toml:/app/strategy.toml:ro
      - ./infra:/app/infra:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      scheduler: {condition: service_started}
    command: ["python", "contest_agent.py"]

  monitor-dash:
    build: ./services/monitor-dash
    restart: unless-stopped
    environment:
      DECISION_TRACE_PATH: /app/logs/decision-traces.jsonl
      TRADE_LOG_PATH: /app/logs/trades.jsonl
      ACTIVE_BROKER: alpaca
      ALPACA_PAPER_TRADE: "true"
      TRADING_LANE: options_paper
      BOT_STRATEGY: defined_risk_options
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./paper-logs/strategy-engine:/app/logs:ro
    ports:
      - "127.0.0.1:${PAPER_DASHBOARD_PORT:-8090}:8090"

volumes:
  alpaca_agent_postgres_data:
  alpaca_agent_redis_data:
